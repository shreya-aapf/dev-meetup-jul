<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetingMind — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #faf9f7;
      --surface:     #ffffff;
      --surface-2:   #f3f1ee;
      --border:      #e8e4de;
      --muted:       #c4bdb4;
      --subtle:      #8a8178;
      --body:        #3d3830;
      --bright:      #1a1612;
      --purple:      #6c3fc5;
      --purple-dim:  #ede8f7;
      --orange:      #d95e1a;
      --orange-dim:  #fdf0e8;
      --success:     #1a9e6e;
      --success-dim: #e6f7f2;
      --danger:      #c93030;
      --danger-dim:  #fdeaea;
      --mono:        'IBM Plex Mono', monospace;
      --sans:        'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--body);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* ── left panel ── */
    .identity {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .identity::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 10% 90%, rgba(108,63,197,0.07) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 90% 10%, rgba(217,94,26,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--purple);
      text-transform: uppercase;
    }

    .identity-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 0;
    }

    .identity-body h1 {
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 600;
      color: var(--bright);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
    }

    .identity-body h1 em {
      font-style: normal;
      color: var(--orange);
    }

    .identity-body p {
      color: var(--subtle);
      font-size: 14px;
      max-width: 340px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .badges { display: flex; flex-direction: column; gap: 10px; }

    .badge {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .badge-icon { font-size: 15px; margin-top: 2px; flex-shrink: 0; }

    .badge-text { font-size: 13px; color: var(--body); line-height: 1.5; }

    .badge-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--purple);
      display: block;
      margin-bottom: 2px;
    }

    .identity-footer {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── right panel ── */
    .auth {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      background: var(--bg);
    }

    .auth-card { width: 100%; max-width: 380px; }

    .auth-heading {
      font-size: 20px;
      font-weight: 600;
      color: var(--bright);
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 13px;
      color: var(--subtle);
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .tab {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--subtle);
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      font-family: var(--sans);
    }

    .tab.active { color: var(--purple); border-bottom-color: var(--purple); }
    .tab:hover:not(.active) { color: var(--body); }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.visible { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--subtle);
      text-transform: uppercase;
      font-family: var(--mono);
    }

    input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--bright);
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--purple-dim);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      padding: 11px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
      font-family: var(--sans);
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .feedback {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
      line-height: 1.5;
    }

    .feedback.error {
      display: block;
      background: var(--danger-dim);
      border: 1px solid rgba(201,48,48,0.2);
      color: var(--danger);
    }

    .feedback.success {
      display: block;
      background: var(--success-dim);
      border: 1px solid rgba(26,158,110,0.2);
      color: var(--success);
    }

    @media (max-width: 720px) {
      .page { grid-template-columns: 1fr; }
      .identity { display: none; }
      .auth { padding: 40px 24px; align-items: flex-start; padding-top: 80px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- left -->
  <div class="identity">
    <div class="wordmark">MeetingMind</div>

    <div class="identity-body"></div>

    <div class="identity-footer">APA Process Diagnostic · Tier 1 · Agent Required</div>
  </div>

  <!-- right -->
  <div class="auth">
    <div class="auth-card">
      <div class="auth-heading">Welcome back</div>
      <div class="auth-sub">Sign in to your account or create a new one.</div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign in</button>
        <button class="tab" onclick="switchTab('register')">Create account</button>
      </div>

      <!-- login -->
      <div id="form-login" class="form visible">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="your username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="login-feedback" class="feedback"></div>
        <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Sign in</button>
      </div>

      <!-- register -->
      <div id="form-register" class="form">
        <div class="field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" placeholder="pick a username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="min 6 characters" autocomplete="new-password" />
        </div>
        <div id="register-feedback" class="feedback"></div>
        <button class="btn btn-primary" id="register-btn" onclick="handleRegister()">Create account</button>
      </div>

    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';

  if (sessionStorage.getItem('user_id')) window.location.href = '/app';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('visible'));
    document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`form-${tab}`).classList.add('visible');
  }

  function setFeedback(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `feedback ${type}`;
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading
      ? (btnId === 'login-btn' ? 'Signing in…' : 'Creating account…')
      : (btnId === 'login-btn' ? 'Sign in' : 'Create account');
  }

  async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { setFeedback('login-feedback', 'Enter your username and password.', 'error'); return; }

    setLoading('login-btn', true);
    try {
      const res  = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { setFeedback('login-feedback', data.error || 'Sign in failed.', 'error'); return; }
      sessionStorage.setItem('user_id',  data.user_id);
      sessionStorage.setItem('username', data.username);
      sessionStorage.setItem('api_key',  data.api_key || '');
      window.location.href = '/app';
    } catch {
      setFeedback('login-feedback', 'Could not reach the server. Try again.', 'error');
    } finally {
      setLoading('login-btn', false);
    }
  }

  async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!username || !password) { setFeedback('register-feedback', 'Choose a username and password.', 'error'); return; }
    if (password.length < 6)    { setFeedback('register-feedback', 'Password must be at least 6 characters.', 'error'); return; }

    setLoading('register-btn', true);
    try {
      const res  = await fetch(`${SUPABASE_URL}/functions/v1/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { setFeedback('register-feedback', data.error || 'Registration failed.', 'error'); return; }
      setFeedback('register-feedback', 'Account created. Signing you in…', 'success');
      sessionStorage.setItem('user_id',  data.user_id);
      sessionStorage.setItem('username', data.username);
      sessionStorage.setItem('api_key',  '');
      setTimeout(() => { window.location.href = '/app'; }, 800);
    } catch {
      setFeedback('register-feedback', 'Could not reach the server. Try again.', 'error');
    } finally {
      setLoading('register-btn', false);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    document.getElementById('form-login').classList.contains('visible') ? handleLogin() : handleRegister();
  });
</script>

</body>
</html>
